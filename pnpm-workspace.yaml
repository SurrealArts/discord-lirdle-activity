packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  canvas: true
  cloudflared: true
  prisma: true
overrides:
  hono: '>=4.13.16'
  find-my-way: '>=9.7.0'
  valibot: '>=1.4.2'
  '@discord/embedded-app-sdk>zod': '4.6.7'
minimumReleaseAgeExclude:
  - hono
  - zod
